name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Generate Official Android Platform & Inject Native Listeners
        run: |
          # 1. Back up native Kotlin listeners and manifest
          mkdir -p /tmp/pak_native
          cp android/app/src/main/AndroidManifest.xml /tmp/pak_native/
          cp -r android/app/src/main/kotlin/com/pakexpense/app /tmp/pak_native/
          
          # 2. Re-scaffold official Android project matching Flutter 3.22 exactly
          rm -rf android
          flutter create . --org com.pakexpense --platforms android
          
          # 3. Inject our custom SMS receiver and notification listener
          rm -rf android/app/src/main/kotlin/*
          mkdir -p android/app/src/main/kotlin/com/pakexpense/app
          cp /tmp/pak_native/app/* android/app/src/main/kotlin/com/pakexpense/app/
          cp /tmp/pak_native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          
          # 4. Align package namespace and applicationId
          sed -i 's/com.pakexpense.pak_expense/com.pakexpense.app/g' android/app/build.gradle
          
          # 5. Disable release fatal lint abort
          echo "android { lintOptions { checkReleaseBuilds false; abortOnError false } }" >> android/app/build.gradle

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PakExpense-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
